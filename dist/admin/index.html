<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน | ผลงานช่างข้างบ้าน</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--green:#315d4f;--orange:#f27b35;--cream:#fff9f2;--line:#e5e2da}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#17211f;font-family:Prompt,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px}.brand img{width:48px;height:48px;border-radius:50%}.back{color:var(--green)}h1{font-family:Kanit;margin:0;font-size:38px}p{color:#65716d}.panel,.job{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:24px}label{display:block;font-weight:500;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}.drop{border:2px dashed #bad0c0;border-radius:14px;padding:20px;text-align:center;background:#f6fbf6}.btn{margin-top:18px;border:0;border-radius:10px;padding:12px 20px;background:var(--orange);color:#fff;font:inherit;font-weight:600;cursor:pointer}.jobs{display:grid;gap:18px}.job-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.job h2{font-family:Kanit;margin:0}.job-head small{color:#65716d}.job-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:15px}.lane{border-radius:15px;padding:14px;background:#fff9f2}.lane h3{font-size:16px;margin:0 0 12px}.lane.todo h3{color:#bd6b20}.lane.done h3{color:var(--green)}.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px}.card{flex:0 0 180px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.card img{width:100%;height:130px;object-fit:cover}.card .in{padding:10px}.card h4{margin:0;font-size:14px}.card small{color:#65716d}.del{margin-top:7px;border:0;background:#f8e5df;color:#a13d25;border-radius:8px;padding:6px 9px;cursor:pointer}.empty{color:#9aa39e;font-size:13px}@media(max-width:760px){.row,.job-columns{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}.job-head{align-items:flex-start;flex-direction:column}.cards{margin-right:-14px}}</style></head>
<body><div class="wrap"><div class="top"><div class="brand"><img src="assets/logo-changban.png" alt="โลโก้"><span>หลังบ้านผลงานช่างข้างบ้าน</span></div><a class="back" href="index.html">← กลับหน้าเว็บ</a></div><h1>จัดการผลงานตามงาน</h1><p>สร้างชื่อ “งาน” หนึ่งครั้ง แล้วอัปโหลดรูปงานนั้นเป็นระหว่างทำหรือทำเสร็จได้ในหมวดเดียวกัน</p><div class="panel"><form id="workForm"><div class="row"><div><label>ชื่องาน / หมวดผลงาน</label><input id="job" required placeholder="เช่น บ้านสวนคุณสมชาย"></div><div><label>ประเภทงาน</label><select id="category"><option>ซ่อมบ้าน</option><option>ตัดต้นไม้</option><option>ช่างไฟ</option><option>ช่างประปา</option></select></div><div><label>สถานะรูปนี้</label><select id="status"><option value="todo">ระหว่างทำ</option><option value="done">ทำเสร็จแล้ว</option></select></div></div><label>คำอธิบายรูป (ไม่บังคับ)</label><input id="caption" placeholder="เช่น ขึ้นโครงหลังคา / ติดตั้งระบบน้ำ"><label>รูปผลงาน</label><div class="drop"><input id="image" type="file" accept="image/*" required></div><button class="btn" type="submit">เพิ่มรูปเข้าหนึ่งงาน</button><span id="msg" style="margin-left:12px;color:var(--green)"></span></form></div><div class="jobs" id="jobs"></div></div>
<script>const key='changbanWorks';let works=JSON.parse(localStorage.getItem(key)||'[]');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const card=(w,i)=>`<div class="card"><img src="${w.image}" alt="${esc(w.caption||w.job)}"><div class="in"><h4>${esc(w.caption||w.job)}</h4><small>${w.status==='done'?'ทำเสร็จแล้ว':'ระหว่างทำ'}</small><br><button class="del" onclick="removeWork(${i})">ลบรูป</button></div></div>`;const render=()=>{const groups={};works.forEach((w,i)=>{const k=w.job||w.title||'งานไม่ระบุชื่อ';(groups[k]??=[]).push({...w,i})});const html=Object.entries(groups).map(([job,items])=>{const todo=items.filter(w=>w.status!=='done'),done=items.filter(w=>w.status==='done');return `<section class="job"><div class="job-head"><h2>${esc(job)}</h2><small>${esc(items[0].category||'งานช่าง')} · ${items.length} รูป</small></div><div class="job-columns"><div class="lane todo"><h3>🛠️ ระหว่างทำ (${todo.length})</h3><div class="cards">${todo.length?todo.map(w=>card(w,w.i)).join(''):'<span class="empty">ยังไม่มีรูป</span>'}</div></div><div class="lane done"><h3>✅ ทำเสร็จแล้ว (${done.length})</h3><div class="cards">${done.length?done.map(w=>card(w,w.i)).join(''):'<span class="empty">ยังไม่มีรูป</span>'}</div></div></div></section>`}).join('');document.getElementById('jobs').innerHTML=html||'<p>ยังไม่มีงานที่บันทึกไว้</p>'};function removeWork(i){works.splice(i,1);localStorage.setItem(key,JSON.stringify(works));render()}document.getElementById('workForm').addEventListener('submit',e=>{e.preventDefault();const f=document.getElementById('image').files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{works.unshift({job:document.getElementById('job').value.trim(),category:document.getElementById('category').value,status:document.getElementById('status').value,caption:document.getElementById('caption').value.trim(),image:reader.result});localStorage.setItem(key,JSON.stringify(works));render();e.target.reset();document.getElementById('msg').textContent='เพิ่มรูปแล้ว';setTimeout(()=>document.getElementById('msg').textContent='',2000)};reader.readAsDataURL(f)});render();</script></body></html>
