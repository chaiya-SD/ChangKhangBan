<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน | จัดการผลงาน</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--green:#315d4f;--orange:#f27b35;--cream:#fff9f2;--line:#e5e2da}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#17211f;font-family:Prompt,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px}.brand img{width:48px;height:48px;border-radius:50%}.back{color:var(--green)}h1{font-family:Kanit;margin:0;font-size:38px}p{color:#65716d}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:25px;margin-bottom:28px}label{display:block;font-weight:500;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.drop{border:2px dashed #bad0c0;border-radius:14px;padding:22px;text-align:center;background:#f6fbf6}.btn{margin-top:18px;border:0;border-radius:10px;padding:12px 20px;background:var(--orange);color:#fff;font:inherit;font-weight:600;cursor:pointer}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.status-box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.status-box h2{margin:0 0 14px;font-family:Kanit}.status-box.todo h2{color:#bd6b20}.status-box.done h2{color:var(--green)}.works{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.card img{width:100%;height:170px;object-fit:cover}.card .in{padding:12px}.card h3{margin:0;font-size:16px}.card small{color:#65716d}.badge{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:99px;font-size:12px}.badge.todo{background:#fff0d8;color:#a55a12}.badge.done{background:#dff2e8;color:#276a4c}.del{margin-top:10px;border:0;background:#f8e5df;color:#a13d25;border-radius:8px;padding:7px 10px;cursor:pointer}@media(max-width:700px){.row,.columns{grid-template-columns:1fr}.works{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}</style></head>
<body><div class="wrap"><div class="top"><div class="brand"><img src="assets/logo-changban.png" alt="โลโก้"><span>หลังบ้านช่างข้างบ้าน</span></div><a class="back" href="index.html">← กลับหน้าเว็บ</a></div><h1>จัดการผลงาน</h1><p>เพิ่มรูปผลงานและระบุสถานะว่าอยู่ระหว่างทำหรือทำเสร็จแล้ว</p><div class="panel"><form id="workForm"><div class="row"><div><label>ชื่อผลงาน</label><input id="title" required placeholder="เช่น ต่อเติมบ้านคุณสมชาย"></div><div><label>หมวดงาน</label><select id="category"><option>ซ่อมบ้าน</option><option>ตัดต้นไม้</option><option>ช่างไฟ</option><option>ช่างประปา</option></select></div></div><label>สถานะผลงาน</label><select id="status"><option value="todo">ระหว่างทำ</option><option value="done">หลังทำเสร็จ</option></select><label>รูปผลงาน</label><div class="drop"><input id="image" type="file" accept="image/*" required></div><button class="btn" type="submit">บันทึกผลงาน</button><span id="msg" style="margin-left:12px;color:var(--green)"></span></form></div><div class="columns"><section class="status-box todo"><h2>🛠️ ระหว่างทำ <span id="todoCount"></span></h2><div class="works" id="todoWorks"></div></section><section class="status-box done"><h2>✅ หลังทำเสร็จ <span id="doneCount"></span></h2><div class="works" id="doneWorks"></div></section></div></div>
<script>const key='changbanWorks';let works=JSON.parse(localStorage.getItem(key)||'[]');const card=(w,i)=>`<div class="card"><img src="${w.image}" alt="${w.title}"><div class="in"><h3>${w.title}</h3><small>${w.category}</small><br><span class="badge ${w.status==='done'?'done':'todo'}">${w.status==='done'?'หลังทำเสร็จ':'ระหว่างทำ'}</span><br><button class="del" onclick="removeWork(${i})">ลบผลงาน</button></div></div>`;const render=()=>{const todo=works.map((w,i)=>({...w,i})).filter(w=>w.status!=='done');const done=works.map((w,i)=>({...w,i})).filter(w=>w.status==='done');document.getElementById('todoWorks').innerHTML=todo.length?todo.map(w=>card(w,w.i)).join(''):'<p>ยังไม่มีผลงาน</p>';document.getElementById('doneWorks').innerHTML=done.length?done.map(w=>card(w,w.i)).join(''):'<p>ยังไม่มีผลงาน</p>';document.getElementById('todoCount').textContent=`(${todo.length})`;document.getElementById('doneCount').textContent=`(${done.length})`};function removeWork(i){works.splice(i,1);localStorage.setItem(key,JSON.stringify(works));render()}document.getElementById('workForm').addEventListener('submit',e=>{e.preventDefault();const f=document.getElementById('image').files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{works.unshift({title:document.getElementById('title').value,category:document.getElementById('category').value,status:document.getElementById('status').value,image:reader.result});localStorage.setItem(key,JSON.stringify(works));render();e.target.reset();document.getElementById('msg').textContent='บันทึกแล้ว';setTimeout(()=>document.getElementById('msg').textContent='',2000)};reader.readAsDataURL(f)});render();</script></body></html>
